<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products checkout">
        <h2>Review &amp; Place your Order</h2>

        <form name="checkout" class="checkout-form">
          <fieldset>
            <legend>Shipping</legend>
            <label for="fname">First Name</label>
            <input
              id="fname"
              name="fname"
              type="text"
              minlength="2"
              maxlength="40"
              autocomplete="given-name"
              required
            />

            <label for="lname">Last Name</label>
            <input
              id="lname"
              name="lname"
              type="text"
              minlength="2"
              maxlength="40"
              autocomplete="family-name"
              required
            />

            <label for="street">Street Address</label>
            <input
              id="street"
              name="street"
              type="text"
              autocomplete="street-address"
              required
            />

            <label for="city">City</label>
            <input
              id="city"
              name="city"
              type="text"
              autocomplete="address-level2"
              required
            />

            <label for="state">State</label>
            <input
              id="state"
              name="state"
              type="text"
              pattern="[A-Za-z]{2}"
              maxlength="2"
              title="Two-letter state code, for example ID"
              autocomplete="address-level1"
              required
            />

            <label for="zip">Zip Code</label>
            <input
              id="zip"
              name="zip"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{5}"
              maxlength="5"
              title="5-digit zip code, for example 83440"
              autocomplete="postal-code"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              id="cardNumber"
              name="cardNumber"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{16}"
              maxlength="16"
              title="16 digits, without spaces"
              autocomplete="cc-number"
              required
            />

            <label for="expiration">Expiration Date (MM/YY)</label>
            <input
              id="expiration"
              name="expiration"
              type="text"
              placeholder="MM/YY"
              pattern="(0?[1-9]|1[0-2])/[0-9]{2}"
              maxlength="5"
              title="Month and year, for example 08/30"
              autocomplete="cc-exp"
              required
            />

            <label for="code">Security Code</label>
            <input
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              pattern="[0-9]{3,4}"
              maxlength="4"
              title="3 or 4 digits"
              autocomplete="cc-csc"
              required
            />
          </fieldset>

          <fieldset class="order-summary">
            <legend>Order Summary</legend>
            <p>
              Item Subtotal (<span id="num-items">0</span>):
              <output id="cartTotal">$0.00</output>
            </p>
            <p>Tax (6%): <output id="tax">$0.00</output></p>
            <p>Shipping Estimate: <output id="shipping">$0.00</output></p>
            <p>
              <strong
                >Order Total: <output id="orderTotal">$0.00</output></strong
              >
            </p>
          </fieldset>

          <button id="checkoutSubmit" type="submit">Checkout</button>
          <p id="checkout-message" role="status"></p>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
